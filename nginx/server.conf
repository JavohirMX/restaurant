# Server block configuration for Restaurant Management Platform
# Included by main nginx.conf

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

# Health check endpoint
location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
}

# Django Admin static files
location /static/admin/ {
    alias /var/www/static/admin/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Django static files
location /static/ {
    alias /var/www/static/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Media files
location /media/ {
    alias /var/www/media/;
    expires 7d;
    add_header Cache-Control "public, must-revalidate";
    access_log off;
}

# Django Admin (rate limited)
location /admin/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend;
    include /etc/nginx/proxy_params.conf;
}

# API endpoints (rate limited)
location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend;
    include /etc/nginx/proxy_params.conf;
}

# Health check from backend
location /health/ {
    proxy_pass http://backend;
    include /etc/nginx/proxy_params.conf;
}

# Next.js frontend (default)
location / {
    proxy_pass http://frontend;
    include /etc/nginx/proxy_params.conf;
    
    # WebSocket support for Next.js dev mode (not needed in production)
    # proxy_http_version 1.1;
    # proxy_set_header Upgrade $http_upgrade;
    # proxy_set_header Connection "upgrade";
}

# Error pages
error_page 404 /404.html;
error_page 500 502 503 504 /50x.html;

location = /50x.html {
    root /usr/share/nginx/html;
    internal;
}
