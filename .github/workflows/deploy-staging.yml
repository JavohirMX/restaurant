# Staging Deployment Workflow
# Automatically deploys to staging environment on pushes to main branch

name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: staging-${{ github.sha }}
  DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
  DEPLOY_USER: ${{ secrets.STAGING_USER }}

jobs:
  # Build and push images with staging tag
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/backend:staging
            ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:staging
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to staging server
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: https://staging.${{ secrets.DOMAIN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add host to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to staging server
        run: |
          # Create deployment script
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e

          DEPLOY_DIR="/opt/restaurant-staging"
          cd $DEPLOY_DIR

          # Pull latest images
          docker-compose -f docker-compose.prod.yml pull

          # Update environment variables
          export IMAGE_TAG="${{ env.IMAGE_TAG }}"
          export GITHUB_REPOSITORY="${{ github.repository }}"

          # Run database migrations
          docker-compose -f docker-compose.prod.yml run --rm backend python manage.py migrate --noinput

          # Collect static files
          docker-compose -f docker-compose.prod.yml run --rm backend python manage.py collectstatic --noinput --clear

          # Restart services
          docker-compose -f docker-compose.prod.yml up -d --remove-orphans

          # Cleanup old images
          docker image prune -f

          echo "Deployment completed successfully!"
          EOF
          chmod +x deploy.sh

          # Copy deployment files to server
          scp -r docker-compose.prod.yml nginx/ scripts/ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/opt/restaurant-staging/
          scp deploy.sh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/opt/restaurant-staging/

          # Execute deployment
          ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} "bash /opt/restaurant-staging/deploy.sh"

      - name: Health check
        run: |
          sleep 30
          curl -f https://staging.${{ secrets.DOMAIN }}/health/ || exit 1

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
