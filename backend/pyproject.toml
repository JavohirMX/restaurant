[project]
name = "restaurant-backend"
version = "0.1.0"
description = "Django backend for restaurant website template"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt[blacklist]>=5.3",
    "django-cors-headers>=4.3",
    "django-ratelimit>=4.1",
    "django-q2>=1.6",
    "django-redis>=5.4",
    "gunicorn>=21.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "pillow>=10.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-django>=4.5",
    "factory-boy>=3.3",
    "freezegun>=1.4",
    "responses>=0.25",
    "coverage>=7.4",
]
